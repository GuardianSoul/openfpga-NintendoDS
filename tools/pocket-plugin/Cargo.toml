[package]
name = "ds-game-files"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pocket Sync / pupdate plugin: ROM tables, game files and compressed ROMs for the NDS_Pocket DS core"
publish = false

[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.test]
opt-level = 2
